version: '3.8'

# MCP Remote Server Docker Compose Configuration
# Deploys alongside n8n on the same EC2 instance

services:
  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    restart: always
    ports:
      - "5679:5679"
    env_file:
      - /opt/mcp/.env
    environment:
      - MCP_PORT=5679
      - MCP_API_KEY=${MCP_API_KEY:-${N8N_API_KEY}}
      - NODE_ENV=production
    volumes:
      - /home/ubuntu/.mcp:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5679/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alex-ai-network

networks:
  alex-ai-network:
    external: true

