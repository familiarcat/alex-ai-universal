version: '3.8'

# N8N + MCP Docker Compose Configuration for Production
# This ensures both n8n and MCP are deployed together
# Used by Terraform user-data script and manual deployments

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.120.4}
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - /opt/n8n/.env
    environment:
      # Explicitly set WEBHOOK_URL (redundant but ensures it's set)
      - WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.pbradygeorgen.com}
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_DOMAIN:-n8n.pbradygeorgen.com}
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN:-n8n.pbradygeorgen.com}
    volumes:
      - /home/ubuntu/.n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alex-ai-network

  mcp-server:
    build:
      context: /home/ubuntu/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: always
    ports:
      - "5679:5679"
    env_file:
      - /opt/mcp/.env
    environment:
      - MCP_PORT=5679
      - MCP_API_KEY=${MCP_API_KEY:-${N8N_API_KEY}}
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - /home/ubuntu/.mcp:/app/data
      - /home/ubuntu/mcp-server:/app/mcp-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5679/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alex-ai-network
    depends_on:
      - n8n

networks:
  alex-ai-network:
    driver: bridge

