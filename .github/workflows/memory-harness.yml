name: Memory Harness

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of memories to generate"
        required: false
        default: "5"
  push:
    paths:
      - "tests/memory-harness/**"
      - ".github/workflows/memory-harness.yml"

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      HARNESS_COUNT: ${{ inputs.count || '5' }}
      MEMORY_WEBHOOK_URL: ${{ secrets.MEMORY_WEBHOOK_URL }}
      N8N_URL: ${{ secrets.N8N_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run memory harness
        run: npm run test:memory
