name: Sync Supabase Secrets to n8n

on:
  workflow_dispatch:
    inputs:
      restart_n8n:
        description: "Restart n8n after applying secrets"
        required: false
        default: "true"
      validation_title:
        description: "Override title for validation memory"
        required: false
        default: "Single Source of Truth"
      validation_summary:
        description: "Override summary for validation memory"
        required: false
        default: "Crew only reads secrets from ~/.zshrc locally"
      validation_analysis:
        description: "Override analysis for validation memory"
        required: false
        default: "When developing locally, load secrets from ~/.zshrc and sync them to AWS Parameter Store so production inherits them automatically."
      validation_tags:
        description: "Comma-separated tags for validation memory"
        required: false
        default: "policy,rag,automation"
  push:
    paths:
      - "scripts/prepare-supabase-ssm.js"
      - "scripts/sync-supabase-secrets.js"
      - "scripts/apply-supabase-secrets.js"
      - "scripts/validate-crew-memory-storage.js"
      - ".github/workflows/supabase-sync.yml"

jobs:
  dns-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify AWS STS DNS resolves
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          TARGETS=("sts.amazonaws.com")
          if [ -n "${AWS_REGION:-}" ]; then
            TARGETS+=("sts.${AWS_REGION}.amazonaws.com")
          fi
          for target in "${TARGETS[@]}"; do
            echo "Checking DNS for ${target}"
            for attempt in {1..5}; do
              if nslookup "${target}" >/dev/null 2>&1; then
                echo "Resolved ${target} on attempt ${attempt}"
                break
              fi
              echo "Attempt ${attempt} failed; retrying..."
              sleep 2
              if [ "${attempt}" -eq 5 ]; then
                echo "Unable to resolve ${target}" >&2
                exit 1
              fi
            done
          done

  secret-prep:
    runs-on: ubuntu-latest
    needs: dns-check
    outputs:
      workflow_hash: ${{ steps.hash_workflows.outputs.workflow_hash }}
      env_hash: ${{ steps.hash_env.outputs.env_hash }}
      workflow_changed: ${{ steps.compare_hashes.outputs.workflow_changed }}
      env_changed: ${{ steps.compare_hashes.outputs.env_changed }}
      any_changed: ${{ steps.compare_hashes.outputs.any_changed }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      N8N_URL: ${{ secrets.N8N_URL }}
      N8N_OWNER_API_KEY: ${{ secrets.N8N_OWNER_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      N8N_SSH_USER: ${{ secrets.N8N_SSH_USER }}
      N8N_SSH_HOST: ${{ secrets.N8N_SSH_HOST }}
      N8N_SSH_KEY: ${{ secrets.N8N_SSH_KEY }}
      ALEX_AI_PARAMETER_NAMESPACE: ${{ secrets.ALEX_AI_PARAMETER_NAMESPACE }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_STS_REGIONAL_ENDPOINTS: regional
    steps:
      - name: Ensure required secrets are present
        run: |
          REQUIRED=(SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY N8N_URL N8N_OWNER_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION N8N_SSH_USER N8N_SSH_HOST N8N_SSH_KEY)
          MISSING=()
          for var in "${REQUIRED[@]}"; do
            if [ -z "${!var}" ]; then
              MISSING+=("$var")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "Missing required secrets: ${MISSING[*]}" >&2
            exit 1
          fi

      - name: Prepare workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: .
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Compute workflow hash
        id: hash_workflows
        run: |
          set -euo pipefail
          WORKFLOW_HASH=$(node <<'NODE'
const fs = require('fs');
const path = require('path');
const crypto = require('crypto');
function listFiles(dir) {
  const entries = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
  const results = [];
  for (const entry of entries) {
    const full = path.join(dir, entry);
    const stat = fs.statSync(full);
    if (stat.isDirectory()) {
      results.push(...listFiles(full));
    } else {
      results.push(full);
    }
  }
  return results;
}
const files = listFiles('n8n-workflows');
if (!files.length) {
  process.stdout.write('none');
  process.exit(0);
}
files.sort();
const hash = crypto.createHash('sha256');
for (const file of files) {
  hash.update(fs.readFileSync(file));
}
process.stdout.write(hash.digest('hex'));
NODE
)
          WORKFLOW_HASH=$(echo "$WORKFLOW_HASH" | tr -d '\n\r')
          echo "workflow_hash=${WORKFLOW_HASH:-none}" >> "$GITHUB_OUTPUT"

      - name: Compute env payload hash
        id: hash_env
        run: |
          set -euo pipefail
          ENV_HASH=$(node <<'NODE'
const crypto = require('crypto');
const { loadCrewCredentials } = require('./scripts/utils/load-crew-credentials');
const creds = loadCrewCredentials();
const payload = {
  SUPABASE_URL: creds.supabase.url || '',
  SUPABASE_SERVICE_ROLE_KEY: creds.supabase.serviceKey || '',
  SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY || '',
  SUPABASE_API_KEY: process.env.SUPABASE_API_KEY || '',
  OPENAI_API_KEY: process.env.OPENAI_API_KEY || ''
};
const hash = crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
process.stdout.write(hash);
NODE
)
          ENV_HASH=$(echo "$ENV_HASH" | tr -d '\n\r')
          echo "env_hash=${ENV_HASH:-none}" >> "$GITHUB_OUTPUT"

      - name: Compare hashes with previous state
        id: compare_hashes
        env:
          WORKFLOW_HASH: ${{ steps.hash_workflows.outputs.workflow_hash }}
          ENV_HASH: ${{ steps.hash_env.outputs.env_hash }}
          STATE_NAMESPACE: ${{ secrets.ALEX_AI_PARAMETER_NAMESPACE }}
        run: |
          set -euo pipefail
          BASE_NAMESPACE=${STATE_NAMESPACE:-/alex-ai/supabase}
          BASE_NAMESPACE=${BASE_NAMESPACE%/}
          WORKFLOW_PARAM="${BASE_NAMESPACE}/state/workflow-hash"
          ENV_PARAM="${BASE_NAMESPACE}/state/env-hash"

          get_param () {
            local NAME="$1"
            local VALUE
            set +e
            VALUE=$(aws ssm get-parameter --name "$NAME" --with-decryption --query 'Parameter.Value' --output text 2>/tmp/param.err)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ]; then
              if grep -q 'ParameterNotFound' /tmp/param.err 2>/dev/null; then
                rm -f /tmp/param.err
                echo ""
                return
              else
                cat /tmp/param.err >&2
                rm -f /tmp/param.err
                exit 1
              fi
            fi
            rm -f /tmp/param.err
            echo "$VALUE"
          }

          PREV_WORKFLOW_HASH=$(get_param "$WORKFLOW_PARAM")
          PREV_ENV_HASH=$(get_param "$ENV_PARAM")

          WORKFLOW_CHANGED=$([ "${WORKFLOW_HASH}" != "${PREV_WORKFLOW_HASH}" ] && echo true || echo false)
          ENV_CHANGED=$([ "${ENV_HASH}" != "${PREV_ENV_HASH}" ] && echo true || echo false)
          if [ "${WORKFLOW_CHANGED}" = "true" ] || [ "${ENV_CHANGED}" = "true" ]; then
            ANY_CHANGED=true
          else
            ANY_CHANGED=false
          fi

          {
            echo "workflow_changed=${WORKFLOW_CHANGED}"
            echo "env_changed=${ENV_CHANGED}"
            echo "any_changed=${ANY_CHANGED}"
          } >> "$GITHUB_OUTPUT"

      - name: Push Supabase secrets to Parameter Store
        if: ${{ steps.compare_hashes.outputs.env_changed == 'true' }}
        run: node scripts/sync-supabase-secrets.js

  remote-apply:
    runs-on: ubuntu-latest
    needs: secret-prep
    if: ${{ needs.secret-prep.outputs.env_changed == 'true' }}
    env:
      N8N_SSH_USER: ${{ secrets.N8N_SSH_USER }}
      N8N_SSH_HOST: ${{ secrets.N8N_SSH_HOST }}
      N8N_SSH_KEY: ${{ secrets.N8N_SSH_KEY }}
      N8N_REMOTE_PATH: ${{ secrets.N8N_REMOTE_PATH }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      ALEX_AI_PARAMETER_NAMESPACE: ${{ secrets.ALEX_AI_PARAMETER_NAMESPACE }}
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: .

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_SSH_KEY }}

      - name: Apply secrets on remote host
        env:
          REMOTE_PATH: ${{ secrets.N8N_REMOTE_PATH }}
        run: |
          REMOTE_DIR=${REMOTE_PATH:-/home/${{ secrets.N8N_SSH_USER }}/alex-ai-universal}
          ssh -o StrictHostKeyChecking=no ${{ secrets.N8N_SSH_USER }}@${{ secrets.N8N_SSH_HOST }} "\
            set -euo pipefail; \
            cd \"${REMOTE_DIR}\"; \
            git pull --ff-only || true; \
            node scripts/apply-supabase-secrets.js --output /etc/n8n/env.d/50-supabase.env \
          "

  workflow-sync:
    runs-on: ubuntu-latest
    needs: secret-prep
    if: ${{ needs.secret-prep.outputs.workflow_changed == 'true' }}
    env:
      N8N_URL: ${{ secrets.N8N_URL }}
      N8N_OWNER_API_KEY: ${{ secrets.N8N_OWNER_API_KEY }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
    steps:
      - name: Prepare workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          download-artifact: 'true'
          artifact-name: workspace-${{ github.run_id }}

      - name: Install dependencies (if package-lock exists)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Sync n8n workflows via API
        run: node scripts/sync-n8n-workflows.js

  redeploy:
    runs-on: ubuntu-latest
    needs:
      - secret-prep
      - remote-apply
      - workflow-sync
    if: ${{ needs.secret-prep.outputs.any_changed == 'true' && (github.event.inputs.restart_n8n != 'false') }}
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: .

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_SSH_KEY }}

      - name: Restart n8n with updated configuration
        env:
          REMOTE_PATH: ${{ secrets.N8N_REMOTE_PATH }}
          RESTART_N8N: ${{ github.event.inputs.restart_n8n || 'true' }}
        run: |
          if [ "${RESTART_N8N}" != "true" ]; then
            echo "restart_n8n input set to false; skipping restart step."
            exit 0
          fi

          ssh -o StrictHostKeyChecking=no ${{ secrets.N8N_SSH_USER }}@${{ secrets.N8N_SSH_HOST }} "\
            set -euo pipefail; \
            if command -v systemctl >/dev/null 2>&1; then \
              sudo systemctl restart n8n || sudo docker compose restart n8n; \
            else \
              sudo docker compose restart n8n; \
            fi \
          "

  validate:
    runs-on: ubuntu-latest
    needs:
      - secret-prep
      - redeploy
    if: ${{ needs.secret-prep.outputs.any_changed == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      N8N_URL: ${{ secrets.N8N_URL }}
      N8N_OWNER_API_KEY: ${{ secrets.N8N_OWNER_API_KEY }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      VALIDATION_TITLE: ${{ github.event.inputs.validation_title }}
      VALIDATION_SUMMARY: ${{ github.event.inputs.validation_summary }}
      VALIDATION_ANALYSIS: ${{ github.event.inputs.validation_analysis }}
      VALIDATION_TAGS: ${{ github.event.inputs.validation_tags }}
    steps:
      - name: Prepare workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          download-artifact: 'true'
          artifact-name: workspace-${{ github.run_id }}

      - name: Install dependencies (if package-lock exists)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Validate crew-memory-storage workflow
        run: |
          node scripts/validate-crew-memory-storage.js \
            --title "${VALIDATION_TITLE:-Single Source of Truth}" \
            --summary "${VALIDATION_SUMMARY:-Crew only reads secrets from ~/.zshrc locally}" \
            --analysis "${VALIDATION_ANALYSIS:-When developing locally, load secrets from ~/.zshrc and sync them to AWS Parameter Store so production inherits them automatically.}" \
            --tags "${VALIDATION_TAGS:-policy,rag,automation}"

  record-state:
    runs-on: ubuntu-latest
    needs:
      - secret-prep
      - validate
    if: ${{ needs.secret-prep.outputs.any_changed == 'true' && needs.validate.result == 'success' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ALEX_AI_PARAMETER_NAMESPACE: ${{ secrets.ALEX_AI_PARAMETER_NAMESPACE }}
      WORKFLOW_HASH: ${{ needs.secret-prep.outputs.workflow_hash }}
      ENV_HASH: ${{ needs.secret-prep.outputs.env_hash }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Persist hash state
        run: |
          set -euo pipefail
          BASE_NAMESPACE=${ALEX_AI_PARAMETER_NAMESPACE:-/alex-ai/supabase}
          BASE_NAMESPACE=${BASE_NAMESPACE%/}
          WORKFLOW_PARAM="${BASE_NAMESPACE}/state/workflow-hash"
          ENV_PARAM="${BASE_NAMESPACE}/state/env-hash"
          aws ssm put-parameter --name "$WORKFLOW_PARAM" --type SecureString --overwrite --value "${WORKFLOW_HASH}"
          aws ssm put-parameter --name "$ENV_PARAM" --type SecureString --overwrite --value "${ENV_HASH}"


