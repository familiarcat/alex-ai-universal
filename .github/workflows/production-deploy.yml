name: 🚀 Production Deployment Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  # 🔍 Pre-deployment Checks
  pre-deployment:
    name: 🔍 Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
      environment: ${{ steps.decision.outputs.environment }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🔍 Security audit
        run: npm audit --audit-level=moderate
        
      - name: 🧪 Run tests
        run: npm test
        
      - name: 🔨 Build packages
        run: npm run build
        
      - name: 📊 Code quality check
        run: npm run lint
        
      - name: 🎯 Deployment decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # 🏗️ Build and Package
  build-packages:
    name: 🏗️ Build and Package
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.should_deploy == 'true'
    
    strategy:
      matrix:
        package: [
          '@alex-ai/core',
          '@alex-ai/cli', 
          '@alex-ai/vscode',
          '@alex-ai/cursor-extension',
          '@alex-ai/universal-extension'
        ]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🔨 Build package
        run: |
          cd packages/${matrix.package#@alex-ai/}
          npm run build
          
      - name: 📦 Package for distribution
        run: |
          cd packages/${matrix.package#@alex-ai/}
          npm pack
          
      - name: 📤 Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-package
          path: packages/${matrix.package#@alex-extension/}/*.tgz

  # 🚀 Deploy NPM Packages
  deploy-npm:
    name: 🚀 Deploy NPM Packages
    runs-on: ubuntu-latest
    needs: [pre-deployment, build-packages]
    if: needs.pre-deployment.outputs.should_deploy == 'true'
    environment: ${{ needs.pre-deployment.outputs.environment }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🔨 Build all packages
        run: npm run build
        
      - name: 📦 Publish packages
        run: npm run publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: 🏷️ Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # 🌐 Deploy Dashboard
  deploy-dashboard:
    name: 🌐 Deploy Dashboard
    runs-on: ubuntu-latest
    needs: [pre-deployment, build-packages]
    if: needs.pre-deployment.outputs.should_deploy == 'true'
    environment: ${{ needs.pre-deployment.outputs.environment }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install dependencies
        working-directory: ./dashboard
        run: npm ci
        
      - name: 🔨 Build dashboard
        working-directory: ./dashboard
        run: npm run build
        env:
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          
      - name: 🚀 Deploy to S3
        working-directory: ./dashboard
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} --delete
          
      - name: 🔄 Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
            
      - name: 🧪 Test deployment
        run: |
          sleep 30
          curl -f https://${{ secrets.DASHBOARD_URL }} || exit 1

  # 🏥 Health Check
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: [deploy-npm, deploy-dashboard]
    if: always() && (needs.deploy-npm.result == 'success' || needs.deploy-dashboard.result == 'success')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🏥 Run health checks
        run: |
          node scripts/production-monitoring.js --health-check
        env:
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
      - name: 📊 Performance test
        run: |
          node scripts/production-monitoring.js --performance-test
          
      - name: 🔒 Security scan
        run: |
          node scripts/production-monitoring.js --security-scan

  # 📊 Monitoring Setup
  setup-monitoring:
    name: 📊 Setup Monitoring
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always() && needs.health-check.result == 'success'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 📊 Setup monitoring
        run: |
          node scripts/production-monitoring.js --setup
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          
      - name: 🚨 Configure alerts
        run: |
          node scripts/production-monitoring.js --configure-alerts
          
      - name: 📈 Start monitoring
        run: |
          nohup node scripts/production-monitoring.js --daemon &
          echo $! > monitoring.pid
          
      - name: 📤 Upload monitoring config
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-config
          path: |
            monitoring.pid
            logs/
            metrics.json

  # 🎉 Deployment Success
  deployment-success:
    name: 🎉 Deployment Success
    runs-on: ubuntu-latest
    needs: [deploy-npm, deploy-dashboard, health-check, setup-monitoring]
    if: always() && (needs.deploy-npm.result == 'success' || needs.deploy-dashboard.result == 'success')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎉 Deployment success notification
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📦 NPM packages: ${{ needs.deploy-npm.result }}"
          echo "🌐 Dashboard: ${{ needs.deploy-dashboard.result }}"
          echo "🏥 Health check: ${{ needs.health-check.result }}"
          echo "📊 Monitoring: ${{ needs.setup-monitoring.result }}"
          
      - name: 📧 Send success notification
        if: always()
        run: |
          # Send notification to Slack, email, etc.
          echo "✅ Alex AI deployment successful"
          echo "🚀 All systems operational"
          echo "📊 Monitoring active"
