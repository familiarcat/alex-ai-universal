events {
    worker_connections 1024;
}

http {
    upstream alex_ai_web {
        server alex-ai-web:3000;
    }

    upstream alex_ai_dashboard {
        server alex-ai-dashboard:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # Web server routing
        location / {
            proxy_pass http://alex_ai_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard routing
        location /dashboard {
            proxy_pass http://alex_ai_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routing
        location /api/ {
            proxy_pass http://alex_ai_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
