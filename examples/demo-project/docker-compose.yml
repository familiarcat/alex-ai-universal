version: '3.8'

services:
  alex-ai-web:
    build: .
    container_name: alex-ai-web-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVER_TYPE=web
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - alex-ai-network

  alex-ai-dashboard:
    build: .
    container_name: alex-ai-dashboard-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SERVER_TYPE=dashboard
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - alex-ai-web
    networks:
      - alex-ai-network

  nginx:
    image: nginx:alpine
    container_name: alex-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - alex-ai-web
      - alex-ai-dashboard
    restart: unless-stopped
    networks:
      - alex-ai-network

networks:
  alex-ai-network:
    driver: bridge

volumes:
  config:
  logs:


